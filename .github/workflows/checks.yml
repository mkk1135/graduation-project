name: checks and unit tests
on: [push, pull_request]
jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rebuild the results database and check it against every result file
        run: python results_db.py
      - name: Check that the recorded decisions of the protocol are reproduced from the database
        run: python decide.py check
      - name: Run the self-checks of the evaluation code (metrics, Wilson interval, McNemar test, large-image rule, label mapping)
        run: |
          pip install pillow
          python -c "import evaluate, decide, results_db, sys; assert 'torch' not in sys.modules; print('self-checks passed')"
      - name: Run the unit tests (tests/, pytest; CPU only, no model is downloaded or loaded)
        run: |
          pip install pillow==13.0.0 pytest==9.2.0 anthropic==2.12.0
          python -m pytest -v tests
