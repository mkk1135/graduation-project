<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo: a magnifying glass over a photo and pixels">
  <title>Logo: a magnifying glass over a photo and pixels</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="27" cy="27" r="14"/>
    </clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#badge)"/>
  <g clip-path="url(#lens)">
    <!-- left half: a photograph, sun over a mountain -->
    <rect x="13" y="13" width="14" height="28" fill="#bae6fd"/>
    <circle cx="20.5" cy="21" r="3.2" fill="#f59e0b"/>
    <path d="M13 41V35.5L20.5 28L27 34.5V41Z" fill="#059669"/>
    <!-- right half: the same scene broken into pixels -->
    <rect x="27" y="13" width="14" height="28" fill="#a78bfa"/>
    <g fill="#7c3aed">
      <rect x="30.5" y="13" width="3.5" height="3.5"/>
      <rect x="37.5" y="16.5" width="3.5" height="3.5"/>
      <rect x="27" y="20" width="3.5" height="3.5"/>
      <rect x="34" y="23.5" width="3.5" height="3.5"/>
      <rect x="30.5" y="27" width="3.5" height="3.5"/>
    </g>
    <g fill="#f472b6">
      <rect x="27" y="13" width="3.5" height="3.5"/>
      <rect x="34" y="16.5" width="3.5" height="3.5"/>
      <rect x="37.5" y="23.5" width="3.5" height="3.5"/>
      <rect x="27" y="27" width="3.5" height="3.5"/>
      <rect x="34" y="30.5" width="3.5" height="3.5"/>
    </g>
    <g fill="#059669">
      <rect x="27" y="34" width="3.5" height="7"/>
      <rect x="30.5" y="37.5" width="3.5" height="3.5"/>
      <rect x="37.5" y="34" width="3.5" height="7"/>
    </g>
    <g fill="#34d399">
      <rect x="27" y="30.5" width="3.5" height="3.5"/>
      <rect x="34" y="37.5" width="3.5" height="3.5"/>
      <rect x="37.5" y="30.5" width="3.5" height="3.5"/>
    </g>
    <path d="M35.5 15.5Q36 19.5 40 20Q36 20.5 35.5 24.5Q35 20.5 31 20Q35 19.5 35.5 15.5Z" fill="#fff"/>
    <path d="M27 13V41" stroke="#fff" stroke-width="1"/>
  </g>
  <circle cx="27" cy="27" r="15.5" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M38.5 38.5L50 50" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M50 8.5Q50.5 13.5 55.5 14Q50.5 14.5 50 19.5Q49.5 14.5 44.5 14Q49.5 13.5 50 8.5Z" fill="#fff"/>
</svg>
